name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

env:
  # Dummy values that satisfy schema validation in test paths.
  # CI sets the real DB URL via job services below.
  AUTH_SECRET: ci-only-do-not-use-in-production
  AUTH_URL: http://localhost:3000
  APP_ENCRYPTION_KEY: BB6f7G8JeZG2gqmW6XW3z9cq3mF1FQpt5MyLF/2yTnY=
  NODE_ENV: test

jobs:
  lint-typecheck-test:
    name: Lint, typecheck, unit + isolation tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel
          POSTGRES_DB: sentinel_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sentinel"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://sentinel:sentinel@localhost:5432/sentinel_test?schema=public
      TEST_DATABASE_URL: postgresql://sentinel:sentinel@localhost:5432/sentinel_test?schema=public
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install
        run: npm ci
      - name: Prisma generate + migrate
        run: |
          npx prisma generate
          npx prisma migrate deploy
      - name: Lint
        run: npm run lint
        continue-on-error: true # warnings only — CI does not block
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Tenant-isolation tests
        run: npm run test:isolation

  backtest:
    name: Engine backtest (gates threshold changes)
    runs-on: ubuntu-latest
    env:
      APP_ENCRYPTION_KEY: BB6f7G8JeZG2gqmW6XW3z9cq3mF1FQpt5MyLF/2yTnY=
      AUTH_SECRET: ci-only
      AUTH_URL: http://localhost:3000
      DATABASE_URL: postgresql://nope/nope
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npx prisma generate
      - name: Backtest
        run: BACKTEST_PER_ARCHETYPE=200 npm run backtest

  language-eval:
    name: Language eval (only on prompt changes)
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.changed_files, 'src/lib/ai/prompts.ts') || contains(github.event.pull_request.changed_files, 'evals/')
    env:
      APP_ENCRYPTION_KEY: BB6f7G8JeZG2gqmW6XW3z9cq3mF1FQpt5MyLF/2yTnY=
      AUTH_SECRET: ci-only
      AUTH_URL: http://localhost:3000
      DATABASE_URL: postgresql://nope/nope
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npx prisma generate
      - run: npm run eval:language

  build:
    name: Production build
    runs-on: ubuntu-latest
    env:
      APP_ENCRYPTION_KEY: BB6f7G8JeZG2gqmW6XW3z9cq3mF1FQpt5MyLF/2yTnY=
      AUTH_SECRET: ci-only
      AUTH_URL: http://localhost:3000
      DATABASE_URL: postgresql://nope/nope
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel
          POSTGRES_DB: sentinel_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sentinel"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://sentinel:sentinel@localhost:5432/sentinel_test?schema=public
      REDIS_URL: redis://localhost:6379
      APP_ENCRYPTION_KEY: BB6f7G8JeZG2gqmW6XW3z9cq3mF1FQpt5MyLF/2yTnY=
      AUTH_SECRET: ci-only
      AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: ""
